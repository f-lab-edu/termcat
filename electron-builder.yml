appId: com.termcat
productName: termcat

files:
  - out/**
  - resources/**
  - '!src/*'
  - '!**/.vscode/*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.*}'

extraResources:
  - from: resources/sprites
    to: sprites

mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.utilities
  icon: resources/icon.icns

dmg:
  artifactName: termcat-${version}.dmg

npmRebuild: false
